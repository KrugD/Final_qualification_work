# FRED-T5-1.7B + CrossMamba Diffusion Decoder (v3 Phase 1)
# Paper: "Discrete Diffusion Language Model for Efficient Text Summarization" (NAACL 2025)
#
# Phase 1: Clean 12-layer decoder with real mamba-ssm on RTX 4090
#   - No distillation, no self-conditioning (add in Phase 2/3)
#   - bf16 mixed precision (RTX 4090 supports bf16)
#   - Gradient checkpointing enabled (works with bf16)
#   - Curriculum encoder unfreezing after 15K steps
#
# Run: python train.py --config config/train_config.yaml

seed: 42

model:
  encoder: "ai-forever/FRED-T5-1.7B"
  freeze_encoder: true
  num_decoder_layers: 12
  decoder_type: "mamba"
  mamba_state_size: 16
  mamba_conv_kernel: 4
  mamba_expand_factor: 2
  num_diffusion_steps: 50
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 1.0
  dropout: 0.1

  # Self-conditioning (Phase 2: enable after ROUGE > 0 confirmed)
  use_self_conditioning: false
  self_cond_prob: 0.5

  # Curriculum encoder unfreezing
  unfreeze_encoder_layers: 6
  unfreeze_after_steps: 15000

  # Memory optimization (works with bf16 on RTX 4090)
  gradient_checkpointing: true

training:
  batch_size: 4
  gradient_accumulation_steps: 8    # effective batch = 32
  learning_rate: 3.0e-5
  encoder_learning_rate: 1.0e-6
  weight_decay: 0.01
  num_epochs: 20
  warmup_steps: 5000
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  early_stopping_patience: 10
  output_dir: "checkpoints"

distillation:
  enabled: false                    # Phase 3: enable with weight=0.3
  teacher_model: "RussianNLP/FRED-T5-Summarizer"
  weight: 0.3
  temperature: 2.0

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 512
  max_target_length: 128
  num_workers: 4
  cache_dir: null

logging:
  comet_project: "fred-diffusion-v3"
  tags:
    - "diffusion"
    - "summarization"
    - "russian"
    - "FRED-T5-1.7B"
    - "CrossMamba"
    - "12-layers"
    - "real-mamba"
    - "phase1"
  log_every_n_steps: 100
  save_every_n_steps: 5000
  eval_every_n_steps: 2000
  disable_comet: false

log_level: "INFO"
