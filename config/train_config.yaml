# FRED-T5-1.7B + CrossMamba Diffusion Decoder
# Paper: "Discrete Diffusion Language Model for Efficient Text Summarization" (NAACL 2025)
#
# RTX 4090 (24 GB VRAM, 32 GB RAM)
# Run: python train.py --config config/train_config.yaml

seed: 42

model:
  encoder: "ai-forever/FRED-T5-1.7B"
  freeze_encoder: true
  num_decoder_layers: 6
  decoder_type: "mamba"
  mamba_state_size: 16
  mamba_conv_kernel: 4
  mamba_expand_factor: 2
  num_diffusion_steps: 50
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 1.0
  dropout: 0.1

training:
  batch_size: 4
  gradient_accumulation_steps: 8    # effective batch = 32
  learning_rate: 3.0e-5
  weight_decay: 0.01
  num_epochs: 15
  warmup_steps: 5000
  max_grad_norm: 1.0
  mixed_precision: "fp16"
  early_stopping_patience: 5
  output_dir: "checkpoints"

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 512
  max_target_length: 128
  num_workers: 4
  cache_dir: null

logging:
  comet_project: "fred-diffusion-summarization"
  tags:
    - "diffusion"
    - "summarization"
    - "russian"
    - "FRED-T5-1.7B"
    - "CrossMamba"
    - "rtx4090"
  log_every_n_steps: 100
  save_every_n_steps: 5000
  eval_every_n_steps: 2000
  disable_comet: false

log_level: "INFO"
