# Configuration for Kaggle training (T4 16GB GPU)
# Based on: "Discrete Diffusion Language Model for Efficient Text Summarization" (NAACL 2025)
#
# Run: python train.py --config config/kaggle_config.yaml
# Resume: python train.py --config config/kaggle_config.yaml --resume checkpoints/checkpoint_epochN_stepM

seed: 42

model:
  encoder: "ai-forever/ruT5-base"
  num_decoder_layers: 6
  num_diffusion_steps: 50
  dropout: 0.1
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 1.0
  decoder_type: "mamba"
  mamba_state_size: 16
  mamba_conv_kernel: 4
  mamba_expand_factor: 2

training:
  batch_size: 8                    # T4 16GB - uses ~13GB VRAM
  gradient_accumulation_steps: 4   # Effective batch = 8 * 4 = 32
  learning_rate: 5.0e-5
  weight_decay: 0.01
  # Dataset: ~197K samples, effective_batch=32 → ~6174 steps/epoch
  # 20 epochs ≈ ~123K steps (paper: 100K steps)
  num_epochs: 20
  warmup_steps: 10000                # Paper: 10,000 warmup steps
  max_grad_norm: 1.0
  mixed_precision: "fp16"          # T4 supports fp16
  early_stopping_patience: 5       # Stop if no improvement for 5 epochs
  output_dir: "/kaggle/working/checkpoints"  # Kaggle output dir

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 512
  max_target_length: 128
  num_workers: 2                   # Kaggle has 4 CPUs
  cache_dir: "/kaggle/working/cache"

logging:
  comet_project: "diffusion-summarization"
  tags:
    - "diffusion"
    - "summarization"
    - "russian"
    - "kaggle"
    - "T4"
  log_every_n_steps: 50
  save_every_n_steps: 2000         # Save often for Kaggle time limits
  eval_every_n_steps: 1000
  disable_comet: false

log_level: "INFO"
