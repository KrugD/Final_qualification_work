# Test configuration - 1 batch training on CPU
# Run: python train.py --config config/test_config.yaml

seed: 42

model:
  encoder: "ai-forever/ruT5-base"
  num_decoder_layers: 2          # Reduced for CPU
  num_diffusion_steps: 5         # Reduced for CPU
  dropout: 0.1
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 0.1
  decoder_type: "mamba"          # Uses fallback on CPU
  mamba_state_size: 8
  mamba_conv_kernel: 4
  mamba_expand_factor: 2

training:
  batch_size: 2                  # Small batch for CPU
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  num_epochs: 1                  # 1 epoch
  warmup_steps: 0                 # No warmup for 1 batch test
  max_grad_norm: 1.0
  mixed_precision: "no"          # No mixed precision on CPU
  output_dir: "checkpoints_test"

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 256         # Reduced for CPU
  max_target_length: 64          # Reduced for CPU
  num_workers: 0                 # No multiprocessing for testing
  train_subset_size: 2           # Only 2 samples = 1 batch!

logging:
  comet_project: "diffusion-summarization-test"
  tags: ["test", "cpu", "debug"]
  log_every_n_steps: 1
  save_every_n_steps: 10000      # Don't save during test
  eval_every_n_steps: 10000      # Don't eval during test
  disable_comet: true            # Disable logging for test

log_level: "INFO"
