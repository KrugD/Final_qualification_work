# FRED-T5-1.7B + CrossMamba Diffusion Decoder — Colab Training
# Paper: "Discrete Diffusion Language Model for Efficient Text Summarization" (NAACL 2025)
#
# Run:    python train.py --config config/colab_config.yaml
# Resume: python train.py --config config/colab_config.yaml --resume "/content/drive/MyDrive/fred_diffusion_checkpoints/checkpoint_epochN_stepM"

seed: 42

model:
  # FRED-T5-1.7B encoder (d_model=1536, 24 layers, ~756M params)
  # Same encoder as RussianNLP/FRED-T5-Summarizer for fair comparison
  encoder: "ai-forever/FRED-T5-1.7B"

  # Freeze encoder — only train decoder (~456M trainable params)
  freeze_encoder: true

  # CrossMamba decoder
  num_decoder_layers: 6
  decoder_type: "mamba"
  mamba_state_size: 16
  mamba_conv_kernel: 4
  mamba_expand_factor: 2

  # Diffusion
  num_diffusion_steps: 50
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 1.0

  dropout: 0.1

training:
  # Memory-optimized for Colab:
  #   T4 16GB  → batch 2, accum 16 (effective 32)
  #   A100 40GB → batch 8, accum 4  (effective 32)
  # Auto-adjusted in notebook cell
  batch_size: 2
  gradient_accumulation_steps: 16

  learning_rate: 3.0e-5    # Slightly lower LR for larger model
  weight_decay: 0.01
  num_epochs: 15           # ~92K steps, sufficient with frozen encoder
  warmup_steps: 5000       # Faster warmup (encoder already pretrained)
  max_grad_norm: 1.0
  mixed_precision: "fp16"
  early_stopping_patience: 5
  output_dir: "/content/drive/MyDrive/fred_diffusion_checkpoints"

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 512
  max_target_length: 128
  num_workers: 2
  cache_dir: "/content/cache"

logging:
  comet_project: "fred-diffusion-summarization"
  tags:
    - "diffusion"
    - "summarization"
    - "russian"
    - "FRED-T5-1.7B"
    - "CrossMamba"
    - "colab"
  log_every_n_steps: 50
  save_every_n_steps: 2000
  eval_every_n_steps: 1000
  disable_comet: false

log_level: "INFO"
