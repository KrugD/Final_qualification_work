# Configuration for Google Colab Pro training
# Based on: "Discrete Diffusion Language Model for Efficient Text Summarization" (NAACL 2025)
#
# Run: python train.py --config config/colab_config.yaml
# Resume: python train.py --config config/colab_config.yaml --resume /content/drive/MyDrive/diffusion_checkpoints/checkpoint_epochN_stepM

seed: 42

model:
  encoder: "ai-forever/ruT5-base"
  num_decoder_layers: 6
  num_diffusion_steps: 20
  dropout: 0.1
  schedule_type: "cosine"
  use_semantic_noise: true
  similarity_loss_weight: 0.1
  decoder_type: "mamba"
  mamba_state_size: 16
  mamba_conv_kernel: 4
  mamba_expand_factor: 2

training:
  # Colab Pro GPU: A100 40GB → batch 16, V100 16GB → batch 8, T4 → batch 8
  # Adjust batch_size based on your GPU (check nvidia-smi)
  batch_size: 8
  gradient_accumulation_steps: 4   # Effective batch = 8 * 4 = 32
  learning_rate: 5.0e-5
  weight_decay: 0.01
  # Dataset: ~197K samples, effective_batch=32 → ~6174 steps/epoch
  # 20 epochs ≈ ~123K steps (paper: 100K steps)
  num_epochs: 20
  warmup_steps: 10000                # Paper: 10,000 warmup steps
  max_grad_norm: 1.0
  mixed_precision: "fp16"
  early_stopping_patience: 5        # Stop if no improvement for 5 epochs
  # Save to Google Drive for persistence across sessions
  output_dir: "/content/drive/MyDrive/diffusion_checkpoints"

data:
  dataset: "RussianNLP/Mixed-Summarization-Dataset"
  max_source_length: 512
  max_target_length: 128
  num_workers: 2
  cache_dir: "/content/cache"

logging:
  comet_project: "diffusion-summarization"
  tags:
    - "diffusion"
    - "summarization"
    - "russian"
    - "colab-pro"
  log_every_n_steps: 50
  save_every_n_steps: 2000
  eval_every_n_steps: 1000
  disable_comet: false

log_level: "INFO"
