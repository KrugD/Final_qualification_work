version: "3.8"

services:
  # Redis for task queue, status tracking, user history
  redis:
    image: redis:7-alpine
    container_name: summarization_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Telegram Bot API Local Server (removes 20MB file limit -> up to 2GB)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram_bot_api
    ports:
      - "8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  redis_data:
