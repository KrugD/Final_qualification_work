[project]
name = "diffusion-summarization"
version = "0.1.0"
description = "Masked Diffusion Language Model for Russian Text Summarization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["diffusion", "summarization", "nlp", "russian", "transformers"]

dependencies = [
    # Deep Learning
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    
    # Data
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    
    # Metrics
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    
    # Logging
    "comet-ml>=3.35.0",
    
    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    
    # Tokenization
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
# Mamba for CrossMamba decoder (requires CUDA)
mamba = [
    "mamba-ssm>=1.2.0",
    "causal-conv1d>=1.2.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
train = "train:main"
evaluate = "evaluate:main"
generate = "generate:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
