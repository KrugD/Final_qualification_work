[project]
name = "speech-protocol"
version = "0.1.0"
description = "End-to-end multimodal model for meeting protocol generation from audio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "speechbrain>=1.0.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "comet-ml>=3.39.0",
    "evaluate>=0.4.0",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "audiomentations>=0.36.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "pydub>=0.25.1",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]
